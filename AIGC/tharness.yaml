check_boundary_scan_paths:
  - AIGC/roles
  - AIGC/wiki
check_boundary_exclude_names:
  - templates
check_boundary_forbidden_patterns:
  - ':\'
  - "file:///"
  - "/home/"
  - "/Users/"
check_gitignore_required_patterns:
  - AIGC/project-adapters/

session_role_marker_file: AIGC/roles/common/session-visible-state.md
session_role_required_fields:
  - 【当前角色】
  - 【主要职责】
  - 【工作依据】
  - 【详细内容】
session_role_allowed_names:
  - 角色管理员
session_role_forbidden_current_role_names:
  - UI 开发者
  - 3C 开发者
  - 场景开发者
  - 战斗开发者
  - AI 开发者
  - 玩法系统开发者
  - 工具开发者
  - 技术美术开发者
  - 验证审查员
  - wiki 管理员
  - Tharness 能力维护员
session_role_fallback_name: 角色管理员
session_role_required_statements:
  - 本规则固定的是用户可见标识字段，不是让模型从标题、任务类型或输出内容中生成新角色
  - 主会话用户可见 `【当前角色】` 只能是 `角色管理员`
  - 具体执行角色只能由角色管理员通过 SubAgent 或全新会话派发
  - 执行角色名称只能出现在任务派发、工作依据、回收结果或内部执行记录中
  - 被派发角色不能出现在主会话正式输出的 `【当前角色】` 字段中
  - 输出主题、文档类型、评审对象或任务标题不能作为当前角色名
  - 禁止在主会话 `【当前角色】` 中写入任何被派发角色
  - 禁止使用旧 AIGC 三段式作为 Tharness 当前会话的固定回复格式

self_check_path_rules:
  - AIGC/roles|python tools\tharness.py check
  - AIGC/wiki|python tools\tharness.py index --check
  - AIGC/capabilities|python tools\tharness.py doctor
  - AIGC/tharness.yaml|python tools\tharness.py check
  - tools|python tools\tharness.py check
  - tools|python -m unittest tools.test_tharness

self_check_delivery_commands:
  - python tools\tharness.py check
